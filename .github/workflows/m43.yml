name: M43 IOSurface shared buffer lifecycle
on:
  workflow_dispatch:
    inputs:
      kernel_run:
        description: Successful M43 XNU build run
        required: true
        default: '40512979677'
permissions:
  actions: read
  contents: read
jobs:
  userspace:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real host IOSurface sharing and corruption rejection
        run: python3 tools/test_m43_surface_host.py
      - name: Download M43 kernel and root build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch '${{ inputs.kernel_run }}' --interval 30 --exit-status
          gh run view '${{ inputs.kernel_run }}' --json conclusion --jq .conclusion | grep -x success
          gh run download '${{ inputs.kernel_run }}' --name xnu-kernel --dir out
      - name: Compile unchanged M39 M40 M41 and new deferred IOSurface driver
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m39_baseline_main -c tools/preferences-probe.c -o out/m39-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m40_baseline_main -c tools/preferences-live.c -o out/m40-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m41_baseline_main -c tools/foundation-runloop.c -o out/m41-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -framework CoreFoundation -lobjc -Wl,-adhoc_codesign tools/surface-sharing.c out/m39-baseline.o out/m40-baseline.o out/m41-baseline.o -o out/m39-probe
          codesign --verify --strict out/m39-probe
          xcrun otool -L out/m39-probe > out/M43_LOADS.txt
          python3 - <<'PY'
          from pathlib import Path
          b=Path('out/m39-probe').read_bytes()
          for marker in [b'XCOVER5 M39 PASS:',b'XCOVER5 M40 PASS:',b'XCOVER5 M41 PASS:',b'XCOVER5 M43 PASS:',b'invalid_shape_accepted',b'released_ID_still_live']:
              assert marker in b,marker
          for marker in [b'M43_TEST_CORRUPT',b'M41_TEST_NO_SCHEDULE',b'M40_TEST_SKIP_POST']:
              assert marker not in b,'host-only fault leaked into target'
          loads=Path('out/M43_LOADS.txt').read_text()
          assert '/IOSurface.framework/IOSurface' not in loads and '/Foundation.framework/Foundation' not in loads
          PY
      - name: Build isolated RAM root
        run: |
          bash tools/mkhfsroot.sh out/init-mockfs.img out/root-hfs.img out/m21-probe out/m22-probe out/m22-loader out/m23-probe out/m23-code out/m24-probe out/m25-probe out/libm25.dylib out/m26-probe out/libm26.dylib out/m27-probe out/m27-apple-dyld.placeholder out/m28-probe out/m29-probe out/m30-probe out/m31-probe out/m32-probe out/m33-probe out/m34-probe out/m35-proof out/m36-probe out/m37-server out/m37-client out/m38-probe out/m39-probe
          (cd out && shasum -a 256 root-hfs.img m39-probe m39-baseline.o m40-baseline.o m41-baseline.o kernel.development.sweet > M43_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m43-userspace
          path: |
            out/root-hfs.img
            out/m39-probe
            out/m39-baseline.o
            out/m40-baseline.o
            out/m41-baseline.o
            out/kernel.development.sweet
            out/M43_SHA256SUMS
            out/M43_LOADS.txt

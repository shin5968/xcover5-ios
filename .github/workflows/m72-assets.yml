name: M72 original fonts and UI resource cache
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  userspace:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only resource cache and root linkage
        run: python3 tools/test_m72_cache_resources.py
      - name: Download successful M72 synthetic root and owned libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 41175658002 --json status,conclusion,headSha,jobs > source-ci.json
          python3 - <<'PY'
          import json
          s=json.load(open('source-ci.json'))
          assert s['status']=='completed' and s['conclusion']=='success'
          assert s['headSha']=='1574d357062d6adf451100c5cf43279d656c68fa'
          assert s['jobs'] and all(j['status']=='completed' and j['conclusion']=='success' for j in s['jobs'])
          PY
          gh run download 41175658002 --name m72-userspace --dir base
          (cd base && shasum -a 256 -c M72_SHA256SUMS)
          mkdir out
          cp base/init.o base/init-mockfs.img base/libxcover-hackios*.dylib base/M63_LIB_SHA256SUMS out/
          cp source-ci.json out/
      - name: Retain the verified M72 native observer
        run: |
          cp base/m39-probe out/m39-probe
          codesign --verify --strict out/m39-probe
      - name: Add original-resource links to the verified synthetic M72 root
        run: |
          cp base/root-hfs.img out/root-hfs.img
          WORK=$(mktemp -d)
          trap 'hdiutil detach "$WORK/mnt" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -imagekey diskimage-class=CRawDiskImage -owners on -nobrowse -mountpoint "$WORK/mnt" out/root-hfs.img >/dev/null
          sudo python3 tools/stage_m72_cache_resources.py root "$WORK/mnt"
          sudo cp out/m39-probe "$WORK/mnt/sbin/m39-probe"
          sudo chown 0:0 "$WORK/mnt/sbin/m39-probe"
          sudo chmod 755 "$WORK/mnt/sbin/m39-probe"
          sync
          hdiutil detach "$WORK/mnt" >/dev/null
          XCOVER_UI_BOOT=1 XCOVER_HACKIOS_BOOT=1 XCOVER_M63_BOOT=1 python3 tools/check_hfs_owners.py out/root-hfs.img
      - name: Build the same 3GiB cache format with font/UI placeholders
        run: bash tools/mkhfs_m72_cache.sh out/userdata-m72-template.img
      - name: Hash build outputs
        run: |
          (cd out && shasum -a 256 root-hfs.img m39-probe init-mockfs.img libxcover-hackios.dylib libxcover-hackios-sb.dylib userdata-m72-template.img > M72A_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m72-assets
          path: out/

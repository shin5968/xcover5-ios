name: M41 Foundation RunLoop and timers
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  userspace:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real host Foundation and RunLoop integration
        run: python3 tools/test_m41_foundation.py
      - name: Download verified M39V build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40498577871 --name xnu-kernel --dir out
      - name: Compile unchanged M39 M40 baselines and M41 driver
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m39_baseline_main -c tools/preferences-probe.c -o out/m39-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m40_baseline_main -c tools/preferences-live.c -o out/m40-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -framework CoreFoundation -lobjc -Wl,-adhoc_codesign tools/foundation-runloop.c out/m39-baseline.o out/m40-baseline.o -o out/m39-probe
          codesign --verify --strict out/m39-probe
          python3 - <<'PY'
          from pathlib import Path
          b=Path('out/m39-probe').read_bytes()
          for m in [b'XCOVER5 M39 PASS:', b'XCOVER5 M40 PASS:', b'XCOVER5 M41 PASS:', b'Foundation_dlopen',b'timer_callbacks_or_thread_or_payload']:
              assert m in b,m
          for m in [b'M40_TEST_SKIP_POST',b'M41_TEST_NO_SCHEDULE']:
              assert m not in b,'host fault injection leaked into target'
          PY
          xcrun otool -L out/m39-probe > out/M41_LOADS.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('out/M41_LOADS.txt').read_text()
          assert '/Foundation.framework/Foundation' not in s,'Foundation must load after M40 passes'
          PY
      - name: Build isolated RAM root
        run: |
          bash tools/mkhfsroot.sh out/init-mockfs.img out/root-hfs.img out/m21-probe out/m22-probe out/m22-loader out/m23-probe out/m23-code out/m24-probe out/m25-probe out/libm25.dylib out/m26-probe out/libm26.dylib out/m27-probe out/m27-apple-dyld.placeholder out/m28-probe out/m29-probe out/m30-probe out/m31-probe out/m32-probe out/m33-probe out/m34-probe out/m35-proof out/m36-probe out/m37-server out/m37-client out/m38-probe out/m39-probe
          (cd out && shasum -a 256 root-hfs.img m39-probe m39-baseline.o m40-baseline.o kernel.development.sweet > M41_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m41-userspace
          path: |
            out/root-hfs.img
            out/m39-probe
            out/m39-baseline.o
            out/m40-baseline.o
            out/kernel.development.sweet
            out/M41_SHA256SUMS
            out/M41_LOADS.txt

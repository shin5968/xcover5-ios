name: XCover5 XNU early boot

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      diagnostics:
        description: Upload full build tree and inspect KDK libraries
        type: boolean
        default: false
      cache_template:
        description: Rebuild synthetic userdata template (not needed for boot-only updates)
        type: boolean
        default: false
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "tools/mkhfsroot.sh"
      - "tools/mkinit.py"
      - "tools/sweet-init.S"
      - "tools/sweet-exec.S"
      - "tools/sweet-dynamic.S"
      - "tools/sweet-loader.S"
      - "tools/sweet-mmap.S"
      - "tools/sweet-cow.S"
      - "tools/sweet-segment.S"
      - "tools/mksegment.py"
      - "tools/mksymbol.py"
      - "tools/sweet-symbol.S"
      - "tools/sweet-mmap-code.S"
      - "tools/mkdynamic.py"
      - "tools/mkappleprobe.py"
      - "tools/cache-layout.json"
      - "tools/cache_placeholders.py"
      - "tools/mkhfscache.sh"
      - "tools/sweet-cache.S"
      - "tools/sweet-cache-dyld.S"
      - "tools/mkcacheprobe.py"
      - "tools/mklibsystemprobe.py"
      - "tools/sweet-libsystem.S"
      - "tools/mkthreadprobe.py"
      - "tools/sweet-thread.S"
      - "tools/mkmutexprobe.py"
      - "tools/sweet-mutex.S"
      - "tools/sweet-ipc.S"
      - "tools/sweet-process-ipc.S"
      - "tools/sweet-launchd-proof.S"
      - "tools/stage_launchd.py"
      - "tools/mkprocessipcprobe.py"
      - "tools/mkipcprobe.py"
      - "tools/check_pthread_abi.c"
      - "tools/test_m30_libsystem.py"
      - "tools/sweet-apple-dyld.S"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xcover5-xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Restore matching kernel
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: dxb/fakeroot/System/Library/Kernels
          key: xnu-kernel-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ env.DXB_SHA }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}

      - name: Build
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          bash build.sh
          python3 ../tools/test_native_ios_policy.py xnu
          python3 ../tools/test_wait_observer.py xnu
          python3 ../tools/verify_spawn_abi.py xnu ../spawn-abi.c
          xcrun clang -target arm64-apple-macos13 -c ../spawn-abi.c -o ../spawn-abi.o
          test -s "fakeroot/System/Library/Kernels/kernel.development.sweet" || \
            find fakeroot/System/Library/Kernels -type f -name 'kernel.*' -size +1M | grep -q .

      - name: Verify required storage kernel code
        run: |
          python3 -c 'from pathlib import Path; p=Path("dxb/fakeroot/System/Library/Kernels"); ks=[k for k in p.glob("kernel.*") if k.is_file()]; assert ks, "No kernels"; assert all(b"XCOVER5 M18: /dev/xcmmc read-only registered" in k.read_bytes() for k in ks), "M18 patch missing from kernel"; assert all(b"XCOVER5 M20: /dev/xchfs read-only HFS view" in k.read_bytes() for k in ks), "M20 patch missing from kernel"; assert all(b"XCOVER5 M22D: main parse ret=" in k.read_bytes() and b"XCOVER5 M22D: signature failure errno=" in k.read_bytes() for k in ks), "M22D diagnostics missing from kernel"; assert all(b"XCOVER5 M28: /dev/xcuserdata read-only HFS view" in k.read_bytes() for k in ks), "M28 driver missing from kernel"'

      - name: Verify terminal user-abort diagnostics
        run: |
          python3 -c 'from pathlib import Path; ks=[k for k in Path("dxb/fakeroot/System/Library/Kernels").glob("kernel.*") if k.is_file()]; assert ks; assert all(b"XCOVER5 M29D ABORT" in k.read_bytes() and b"XCOVER5 M29D PC=" in k.read_bytes() for k in ks)'

      - name: Verify launchd child diagnostics
        run: |
          python3 -c 'from pathlib import Path; ks=[k for k in Path("dxb/fakeroot/System/Library/Kernels").glob("kernel.*") if k.is_file()]; assert ks; assert all(b"XCOVER5 M35D EXIT" in k.read_bytes() and b"XCOVER5 M35D LOAD" in k.read_bytes() and b"XCOVER5 M35E SIGN" in k.read_bytes() and b"XCOVER5 M35E PAGE" in k.read_bytes() and b"XCOVER5 M35F SIGPROC_BEGIN" in k.read_bytes() and b"XCOVER5 M35F SIGTHREAD_END" in k.read_bytes() and b"XCOVER5 M35F WAKE_END" in k.read_bytes() and b"XCOVER5 M35G SNAP" in k.read_bytes() and b"XCOVER5 M35G EVENT" in k.read_bytes() and b"XCOVER5 NATIVE IOS:" in k.read_bytes() and b"XCOVER5 WAIT START" in k.read_bytes() and b"XCOVER5 WAIT TH" in k.read_bytes() and b"XCOVER5 WAIT DONE" in k.read_bytes() for k in ks), "M35 diagnostics missing"'

      - name: Save compiled kernel before image generation
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dxb/fakeroot/System/Library/Kernels
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: Build minimal userspace init
        run: |
          mkdir -p out
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o out/init.o
          python3 tools/mkinit.py out/init.o out/init-mockfs.img
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-exec.S -o out/m21-probe.o
          python3 tools/mkinit.py out/m21-probe.o out/m21-probe
          shasum -a 256 out/m21-probe > out/PROBE_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-dynamic.S -o out/m22-probe.o
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-loader.S -o out/m22-loader.o
          python3 tools/mkdynamic.py app out/m22-probe.o out/m22-probe
          python3 tools/mkdynamic.py loader out/m22-loader.o out/m22-loader
          shasum -a 256 out/m22-probe out/m22-loader > out/DYNAMIC_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-mmap.S -o out/m23-probe.o
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-mmap-code.S -o out/m23-code.o
          python3 tools/mkinit.py out/m23-probe.o out/m23-probe
          python3 tools/mkinit.py out/m23-code.o out/m23-code
          shasum -a 256 out/m23-probe out/m23-code > out/MMAP_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-cow.S -o out/m24-probe.o
          python3 tools/mkinit.py out/m24-probe.o out/m24-probe
          shasum -a 256 out/m24-probe > out/COW_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-segment.S -o out/m25-probe.o
          python3 tools/mkinit.py out/m25-probe.o out/m25-probe
          python3 tools/mksegment.py out/libm25.dylib
          shasum -a 256 out/m25-probe out/libm25.dylib > out/SEGMENT_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-symbol.S -o out/m26-probe.o
          python3 tools/mkinit.py out/m26-probe.o out/m26-probe
          python3 tools/mksymbol.py out/libm26.dylib
          shasum -a 256 out/m26-probe out/libm26.dylib > out/SYMBOL_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-apple-dyld.S -o out/m27-probe.o
          python3 tools/mkappleprobe.py out/m27-probe.o out/m27-probe out/m27-apple-dyld.placeholder
          shasum -a 256 out/m27-probe out/m27-apple-dyld.placeholder > out/APPLE_PROBE_SHA256SUMS
          python3 tools/cache_placeholders.py assembly out/cache-records.inc
          xcrun clang -target arm64-apple-ios16.0 -Iout -c tools/sweet-cache.S -o out/m28-probe.o
          python3 tools/mkinit.py out/m28-probe.o out/m28-probe
          shasum -a 256 out/m28-probe > out/CACHE_PROBE_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-cache-dyld.S -o out/m29-probe.o
          python3 tools/mkcacheprobe.py out/m29-probe.o out/m29-probe
          shasum -a 256 out/m29-probe > out/CACHE_DYLD_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-libsystem.S -o out/m30-probe.o
          python3 tools/mklibsystemprobe.py out/m30-probe.o out/m30-probe
          python3 tools/test_m30_libsystem.py out/m30-probe
          shasum -a 256 out/m30-probe > out/LIBSYSTEM_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-thread.S -o out/m31-probe.o
          python3 tools/mkthreadprobe.py out/m31-probe.o out/m31-probe
          python3 tools/test_m30_libsystem.py out/m31-probe --thread
          shasum -a 256 out/m31-probe > out/THREAD_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -c tools/check_pthread_abi.c -o out/pthread-abi.o
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-mutex.S -o out/m32-probe.o
          python3 tools/mkmutexprobe.py out/m32-probe.o out/m32-probe
          python3 tools/test_m30_libsystem.py out/m32-probe --mutex
          shasum -a 256 out/m32-probe > out/MUTEX_SHA256SUMS
          shasum -a 256 out/init-mockfs.img > out/INIT_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-ipc.S -o out/m33-probe.o
          python3 tools/mkipcprobe.py out/m33-probe.o out/m33-probe
          python3 tools/test_m30_libsystem.py out/m33-probe --ipc
          shasum -a 256 out/m33-probe > out/IPC_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-process-ipc.S -o out/m34-probe.o
          python3 tools/mkprocessipcprobe.py out/m34-probe.o out/m34-probe
          python3 tools/test_m30_libsystem.py out/m34-probe --process-ipc
          shasum -a 256 out/m34-probe > out/PROCESS_IPC_SHA256SUMS
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-launchd-proof.S -o out/m35-proof.o
          python3 tools/mkinit.py out/m35-proof.o out/m35-proof
          bash tools/mkhfsroot.sh out/init-mockfs.img out/root-hfs.img out/m21-probe out/m22-probe out/m22-loader out/m23-probe out/m23-code out/m24-probe out/m25-probe out/libm25.dylib out/m26-probe out/libm26.dylib out/m27-probe out/m27-apple-dyld.placeholder out/m28-probe out/m29-probe out/m30-probe out/m31-probe out/m32-probe out/m33-probe out/m34-probe out/m35-proof
          shasum -a 256 out/root-hfs.img > out/HFS_SHA256SUMS

      - name: Build synthetic cache volume template
        if: inputs.cache_template == true
        run: |
          bash tools/mkhfscache.sh out/userdata-cache-template.img
          shasum -a 256 out/userdata-cache-template.img > out/CACHE_TEMPLATE_SHA256SUMS

      - name: Package build tree for local compiles
        if: always() && inputs.diagnostics == true && steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always() && inputs.diagnostics == true && steps.kernel-cache.outputs.cache-hit != 'true'
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always() && inputs.diagnostics == true
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

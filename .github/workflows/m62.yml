name: M62 integrated HackiOS UI boot graph
on:
  workflow_dispatch:
    inputs:
      kernel_run:
        description: Successful M50B XNU build run
        required: true
        default: '41058667152'
permissions:
  actions: read
  contents: read
jobs:
  userspace:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded UI jobs and local-only executable placeholders
        run: |
          python3 tools/test_m55_ui_boot.py
          python3 tools/test_m57_chrono_staging.py
          python3 tools/test_m60_objc_staging.py
          python3 tools/test_m62_boot.py
      - name: Build console-prepared PID1 bootstrap
        run: |
          mkdir -p out
          xcrun clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o out/init.o
          python3 tools/mkinit.py out/init.o out/init-mockfs.img
          codesign --verify --strict out/init-mockfs.img
      - name: Build UI boot observer
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Wl,-adhoc_codesign tools/ui-boot-observer.c -o out/m39-probe
          codesign --verify --strict out/m39-probe
          xcrun otool -L out/m39-probe > out/M62_LOADS.txt
      - name: Build original HackiOS UI runtime libraries
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SRC=third_party/hackios-ui-bringup
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -fblocks -dynamiclib -Wl,-undefined,dynamic_lookup -Wl,-adhoc_codesign -Wl,-install_name,/usr/lib/libxcover-hackios.dylib -framework CoreFoundation -framework IOKit -lobjc -o out/libxcover-hackios.dylib "$SRC/inject.c"
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -fblocks -dynamiclib -Wl,-undefined,dynamic_lookup -Wl,-adhoc_codesign -Wl,-install_name,/usr/lib/libxcover-hackios-sb.dylib -framework CoreFoundation -framework IOKit -lobjc -o out/libxcover-hackios-sb.dylib "$SRC/inject_sb.c"
          codesign --verify --strict out/libxcover-hackios.dylib
          codesign --verify --strict out/libxcover-hackios-sb.dylib
          shasum -a 256 out/libxcover-hackios*.dylib > out/M62_LIB_SHA256SUMS
      - name: Download verified M50B kernel and root build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run-summary updates can lag the completed build job. Require every
          # nonempty job to finish successfully, including its artifact upload.
          result=pending
          for attempt in $(seq 1 60); do
            result=$(gh api 'repos/${{ github.repository }}/actions/runs/${{ inputs.kernel_run }}/jobs?per_page=100' --jq '.jobs | if length == 0 then "pending" elif all(.status == "completed") then if all(.conclusion == "success") then "success" else "failure" end else "pending" end')
            test "$result" != failure || exit 1
            test "$result" != success || break
            sleep 10
          done
          test "$result" = success
          gh run download '${{ inputs.kernel_run }}' --name xnu-kernel --dir out
      - name: Build isolated RAM root
        run: |
          XCOVER_UI_BOOT=1 XCOVER_CHRONO_BOOT=1 XCOVER_OBJC_BOOT=1 XCOVER_HACKIOS_BOOT=1 bash tools/mkhfsroot.sh out/init-mockfs.img out/root-hfs.img out/m21-probe out/m22-probe out/m22-loader out/m23-probe out/m23-code out/m24-probe out/m25-probe out/libm25.dylib out/m26-probe out/libm26.dylib out/m27-probe out/m27-apple-dyld.placeholder out/m28-probe out/m29-probe out/m30-probe out/m31-probe out/m32-probe out/m33-probe out/m34-probe out/m35-proof out/m36-probe out/m37-server out/m37-client out/m38-probe out/m39-probe
          (cd out && shasum -a 256 root-hfs.img m39-probe kernel.development.sweet > M62_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m62-userspace
          path: |
            out/libxcover-hackios*.dylib
            out/M62_LIB_SHA256SUMS
            out/init.o
            out/init-mockfs.img
            out/root-hfs.img
            out/m39-probe
            out/kernel.development.sweet
            out/M62_SHA256SUMS
            out/M62_LOADS.txt

name: M48 full physical-panel surface
on:
  workflow_dispatch:
    inputs:
      kernel_run:
        description: Successful M48 XNU build run
        required: true
        default: '0'
permissions:
  actions: read
  contents: read
jobs:
  userspace:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real host IOSurface sharing and corruption rejection
        run: python3 tools/test_m43_surface_host.py
      - name: Validate actual kernel submission body
        run: |
          python3 tools/test_m46_framebuffer.py
          python3 tools/test_m46c_diag.py
          python3 tools/test_m47_sequence.py
          python3 tools/test_m48_fullpanel.py
          python3 tools/test_m48_userspace.py
      - name: Download M46 kernel and root build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run-summary updates can lag the completed build job. Require every
          # nonempty job to finish successfully, including its artifact upload.
          result=pending
          for attempt in $(seq 1 60); do
            result=$(gh api 'repos/${{ github.repository }}/actions/runs/${{ inputs.kernel_run }}/jobs?per_page=100' --jq '.jobs | if length == 0 then "pending" elif all(.status == "completed") then if all(.conclusion == "success") then "success" else "failure" end else "pending" end')
            test "$result" != failure || exit 1
            test "$result" != success || break
            sleep 10
          done
          test "$result" = success
          gh run download '${{ inputs.kernel_run }}' --name xnu-kernel --dir out
      - name: Compile unchanged M39 M40 M41 and new user surface submission probe
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/surface-present.c').read_text()
          assert s.count('int main(int argc,char **argv)')==1
          Path('out/m45-baseline.c').write_text(s.replace('int main(int argc,char **argv)','int m45_baseline_main(int argc,char **argv)'))
          s=Path('tools/surface-framebuffer.c').read_text()
          assert s.count('int main(int argc,char **argv)')==1
          Path('out/m46-baseline.c').write_text(s.replace('int main(int argc,char **argv)','int m46_baseline_main(int argc,char **argv)'))
          s=Path('tools/surface-sequence.c').read_text()
          assert s.count('int main(int argc,char **argv)')==1
          Path('out/m47-baseline.c').write_text(s.replace('int main(int argc,char **argv)','int m47_baseline_main(int argc,char **argv)'))
          PY
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m39_baseline_main -c tools/preferences-probe.c -o out/m39-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m40_baseline_main -c tools/preferences-live.c -o out/m40-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -Dmain=m41_baseline_main -c tools/foundation-runloop.c -o out/m41-baseline.o
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -O1 -Wall -Wextra -Werror -framework CoreFoundation -lobjc -Wl,-adhoc_codesign -Iout -Itools tools/surface-fullpanel.c out/m39-baseline.o out/m40-baseline.o out/m41-baseline.o -o out/m39-probe
          codesign --verify --strict out/m39-probe
          xcrun otool -L out/m39-probe > out/M48_LOADS.txt
          python3 - <<'PY'
          from pathlib import Path
          b=Path('out/m39-probe').read_bytes()
          for marker in [b'XCOVER5 M39 PASS:',b'XCOVER5 M40 PASS:',b'XCOVER5 M41 PASS:',b'XCOVER5 M43 PASS:',b'invalid_shape_accepted',b'released_ID_still_live',b'XCOVER5 M45 PASS:',b'unowned_ID_accepted',b'replay_accepted',b'XCOVER5 M46 PASS:',b'future_wait_accepted',b'M46A RESOLVE PASS',b'IOMobileFramebufferGetTypeID',b'M46A FRAMEBUFFER_RELEASE:',b'M46B ENTRY',b'M46B PHASE wait_reader',b'M46B PHASE reader_sync_begin',b'M46B BASELINE_RETURN',b'M46C TIMEOUT child=',b'progress_nonblock',b'XCOVER5 M47 PASS:',b'm47_source_changed',b'm47_distinct_buffers',b'XCOVER5 M48 PASS:',b'm48_source_changed',b'm48_surface_shape']:
              assert marker in b,marker
          for marker in [b'M43_TEST_CORRUPT',b'M41_TEST_NO_SCHEDULE',b'M40_TEST_SKIP_POST',b'M46C_TEST_HOLD_PHASE']:
              assert marker not in b,'host-only fault leaked into target'
          assert b'IOMobileFramebufferClose' not in b,'nonexistent iOS 16.5 export requested'
          loads=Path('out/M48_LOADS.txt').read_text()
          assert '/IOSurface.framework/IOSurface' not in loads and '/Foundation.framework/Foundation' not in loads
          PY
      - name: Build isolated RAM root
        run: |
          bash tools/mkhfsroot.sh out/init-mockfs.img out/root-hfs.img out/m21-probe out/m22-probe out/m22-loader out/m23-probe out/m23-code out/m24-probe out/m25-probe out/libm25.dylib out/m26-probe out/libm26.dylib out/m27-probe out/m27-apple-dyld.placeholder out/m28-probe out/m29-probe out/m30-probe out/m31-probe out/m32-probe out/m33-probe out/m34-probe out/m35-proof out/m36-probe out/m37-server out/m37-client out/m38-probe out/m39-probe
          (cd out && shasum -a 256 root-hfs.img m39-probe m39-baseline.o m40-baseline.o m41-baseline.o kernel.development.sweet > M48_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: m48-userspace
          path: |
            out/root-hfs.img
            out/m39-probe
            out/m39-baseline.o
            out/m40-baseline.o
            out/m41-baseline.o
            out/kernel.development.sweet
            out/M48_SHA256SUMS
            out/M48_LOADS.txt
